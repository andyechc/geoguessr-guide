<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360"><rect width="600" height="360" fill="#0e1430"/><circle cx="300" cy="150" r="70" fill="#fbbf24"/><rect x="0" y="250" width="600" height="110" fill="#1b2547"/><text x="300" y="60" fill="#eef2ff" font-size="24" text-anchor="middle" font-family="system-ui">Sol al sur = Norte / Sun in south = North</text><text x="300" y="320" fill="#9aa6c7" font-size="20" text-anchor="middle" font-family="system-ui">Nubes densas → ignora el sol / heavy cloud → skip</text></svg>
